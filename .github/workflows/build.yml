name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all plugins
        run: mvn -B package

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: plugins/*/target/*.jar
